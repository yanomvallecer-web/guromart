<!doctype html>

    <title>You're offline · GuroMart</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: #f7f8fb; color: #15233f; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }

      p { margin: 0 0 24px; color: #56627a; line-height: 1.5; }

  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />

      <button type="button" onclick="location.reload()">Try again</button>
